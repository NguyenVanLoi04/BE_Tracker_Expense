name: staging

on:
  push:
    branches:
      - staging

jobs:
  build:
    name: Build & Deploy BE Alma Source Staging
    runs-on: ubuntu-latest

    steps:
    # Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # Set up Docker
    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    # Build Docker image
    - name: Build Docker Image
      run: |
        docker build -t alma-backend-stg:latest .

    # Save Docker image as a tar file
    - name: Save Docker Image
      run: |
        docker save alma-backend-stg > alma-backend-stg.tar
        
    # Transfer Docker image to VPS
    - name: Transfer Docker Image to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_IP_STG }}
        username: ${{ secrets.SERVER_USER_STG }}
        key: ${{ secrets.SERVER_SSH_KEY_STG }}
        source: "alma-backend-stg.tar"
        target: ~/projects/alma/stg

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: SSH into VPS and Deploy using Docker Compose
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_IP_STG }}
        username: ${{ secrets.SERVER_USER_STG }}
        key: ${{ secrets.SERVER_SSH_KEY_STG }}
        script: |
          cd ~/projects/alma/stg

          # Load the image
          docker load < alma-backend-stg.tar

          # Create .env from secret
          echo "${{ secrets.ENV_FILE_STG }}" > .env

          # 🔎 Tìm port random trống trong khoảng 10000–10005
          for PORT in $(seq 10006 10010); do
            if ! nc -z localhost $PORT 2>/dev/null; then
              APP_PORT=$PORT
              break
            fi
          done

          if [ -z "$APP_PORT" ]; then
            echo "❌ No free port found in range 10006-10010"
            exit 1
          fi

          echo "✅ Using random port $APP_PORT for new deploy"
          NEW_DEPLOY="alma-be-stg-$(date +%s)"

          # Tạo file env override cho docker compose
          cat > .env.override <<EOF
          APP_PORT=$APP_PORT
          EOF

          docker compose -p $NEW_DEPLOY --env-file .env.override up -d --build

          # Wait for health checks
          echo "⏳ Waiting for health checks..."
          MAX_RETRIES=60  
          SLEEP_TIME=5
          HEALTH_OK=false

          # Wait for the service to be healthy
          # Check health endpoints
          for i in $(seq 1 $MAX_RETRIES); do
            echo "🔍 Healthcheck attempt $i/$MAX_RETRIES ..."
            if curl -fs http://localhost:$APP_PORT/api/health/readiness | grep -q '"status":"ok"' && \
              curl -fs http://localhost:$APP_PORT/api/health/startup   | grep -q '"status":"ok"' && \
              curl -fs http://localhost:$APP_PORT/api/health/liveness  | grep -q '"status":"ok"'; then
              HEALTH_OK=true
              break
            fi
            sleep $SLEEP_TIME
          done

          if [ "$HEALTH_OK" = true ]; then
            echo "✅ Green passed healthcheck, switching to main port 5006..."

            # 🛑 Stop old projects
            OLD_PROJECTS=$(docker ps -a --filter "label=com.docker.compose.project" \
              --format '{{.Label "com.docker.compose.project"}}' \
              | sort -u | grep alma-be-stg- | grep -v $NEW_DEPLOY || true)

            for PROJECT in $OLD_PROJECTS; do
              echo "🛑 Removing old project: $PROJECT"
              docker compose -p $PROJECT down
            done

            # 🔄 Restart green container trên official port 5006
            cat > .env.override <<EOF
          APP_PORT=5006
          EOF

            docker compose -p $NEW_DEPLOY down
            docker compose -p $NEW_DEPLOY --env-file .env.override up -d --build

            echo "🎉 Switched traffic to new deploy!"
          else
            echo "❌ Healthcheck failed, rolling back..."
            docker compose -p $NEW_DEPLOY down
            exit 1
          fi
